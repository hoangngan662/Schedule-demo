<script>
// Maps Supabase rows to the existing UI data shape; does not connect to Supabase.
function toWebEvent(row) {
  const ordered = rows => [...(rows || [])].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  return {
    id: row.id,
    name: row.name,
    date: row.event_date,
    endDate: row.end_date,
    start: row.start_time?.slice(0,5),
    end: row.end_time?.slice(0,5),
    event_types: [...row.event_types],
    location: row.location,
    thumb: row.event_images?.find(image => image.is_cover)?.image_url || row.thumbnail_url || 'assets/event-default.jpg',
    drive_folder_url: row.drive_folder_url,
    link: row.map_url,
    source: row.source_url,
    sourceLabel: row.source_label,
    desc: row.description,
    notes: row.notes || [],
    threads_topic: row.threads_topic,
    keyword: row.keyword,
    order: row.sort_order,
    event_hashtags: ordered(row.event_hashtags),
    links: ordered(row.event_links),
    event_images: ordered(row.event_images)
  };
}

// Public browser configuration. Access to rows is controlled by Supabase RLS.
const SUPABASE_URL = 'https://mcilqfmkchoktjsltiuk.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_HkKFAwu6ip37E4f-SH8NsA__ZyrQdV2';

async function fetchPublishedEvents(fetcher = fetch) {
  const rows = [];
  const pageSize = 500;
  for (let offset = 0; ; offset += pageSize) {
    const url = new URL('/rest/v1/events', SUPABASE_URL);
    url.searchParams.set('select', '*,event_hashtags(*),event_links(*),event_images(*)');
    url.searchParams.set('is_published', 'eq.true');
    url.searchParams.set('order', 'event_date.asc,start_time.asc.nullslast,sort_order.asc,id.asc');
    url.searchParams.set('limit', String(pageSize));
    url.searchParams.set('offset', String(offset));
    const response = await fetcher(url, {
      headers: { apikey: SUPABASE_PUBLISHABLE_KEY },
      signal: AbortSignal.timeout(15000)
    });
    if (!response.ok) throw new Error(`Supabase request failed (${response.status})`);
    const page = await response.json();
    if (!Array.isArray(page)) throw new Error('Invalid schedule response');
    rows.push(...page);
    if (page.length === 0) return rows;
  }
}

 var parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 var values={};parts.forEach(function(p){values[p.type]=p.value});

 CP=[];$('cur').textContent='Tháng '+(M+1)+' / '+Y;$('hm').textContent=MN[M];$('mi').value=Y+'-'+pad(M+1);chips();
 var q=Q.toLowerCase(),today=todayKey();
 var ev=all.filter(function(e){if(!e.date)return false;var d=ts(e.date);return d.getMonth()===M&&d.getFullYear()===Y&&(!TY||eventTypes(e).indexOf(TY)>=0)&&(!q||((e.name||'')+(e.location||'')).toLowerCase().indexOf(q)>=0)})
  .sort(function(a,b){return Number(isToday(b,today))-Number(isToday(a,today))||(a.date+(a.start||'')).localeCompare(b.date+(b.start||''))||(a.order||0)-(b.order||0)});
 if(loadState!=='ready'){

function row(e){

 h+='<div class="hd"><div class="event-heading"><div class="th thumb-'+esc(e.id)+'">'+th+'</div><div class="inf"><div>'+typeBadges(e)+(today?'<span class="today-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 6 0-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></svg>Hôm nay</span>':'')+'</div><div class="t">'+esc(e.name)+'</div><div class="m"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> '+esc(time)+'</span><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></svg> '+esc(e.location||'Đang cập nhật')+'</span></div></div></div><button class="cv" data-tg="'+esc(e.id)+'" aria-label="'+(open[e.id]?'Thu gọn':'Mở chi tiết')+'" aria-expanded="'+!!open[e.id]+'" aria-controls="detail-'+esc(e.id)+'"><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>';

 tags=tags.filter(function(t,i,a){return typeof t==='string'&&t.trim()&&a.indexOf(t)===i});

 var dd=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();

 h+='<div class="ir"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></svg>Địa điểm</span><div>'+esc(e.location||'Đang cập nhật')+'</div></div>';
 if(/^https?:/.test(e.link||''))h+='<div class="ir"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 14 4-4m-6 6-2 2a4 4 0 0 1-6-6l4-4m12 8 4-4a4 4 0 0 0-6-6l-2 2"/></svg>Link bản đồ</span><div><a href="'+esc(e.link)+'" target="_blank" rel="noopener">Xem trên Google Maps ↗</a></div></div>';

function showGallery(id){
 var event=all.find(function(e){return e.id===id});if(!event)return;
 var images=(event.event_images||[]).filter(function(x){return x&&/^(https?:\/\/|assets\/|data:image\/)/.test(x.image_url||'')}).slice().sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0)});
 $('gallery-title').textContent=event.name+' · '+images.length+' ảnh';
 $('gallery-all').innerHTML=images.map(function(x,i){var label=x.caption||('Ảnh '+(i+1)+' – '+event.name);return '<figure class="gallery-item"><button data-image="'+esc(x.image_url)+'" data-caption="'+esc(label)+'" aria-label="Xem '+esc(label)+'"><img src="'+esc(x.image_url)+'" alt="'+esc(label)+'" loading="lazy"></button></figure>'}).join('');
 $('gallery-dialog').showModal();
}

function driveFolderInfo(value){
 try{
  const url=new URL(value);
  if(url.hostname!=='drive.google.com') return null;
  const id=url.pathname.match(/\/folders\/([\w-]+)/)?.[1]||url.searchParams.get('id');
  if(!id||!/^[-\w]+$/.test(id)) return null;
  return {id,resourceKey:url.searchParams.get('resourcekey')||''};
 }catch{return null}
}
async function fetchDriveImages(folder,fetcher=fetch){
 const files=[];
 let pageToken='';
 do{
  const params=new URLSearchParams({key:GOOGLE_DRIVE_API_KEY,
   q:`'${folder.id}' in parents and trashed=false and mimeType contains 'image/'`,
   fields:'nextPageToken,files(id,name,mimeType,resourceKey)',pageSize:'1000',orderBy:'name'});
  if(pageToken) params.set('pageToken',pageToken);
  const headers={};
  if(folder.resourceKey) headers['X-Goog-Drive-Resource-Keys']=`${folder.id}/${folder.resourceKey}`;
  const response=await fetcher('https://www.googleapis.com/drive/v3/files?'+params,{headers,signal:AbortSignal.timeout(15000)});
  if(!response.ok) throw new Error(`Drive request failed (${response.status})`);
  const data=await response.json();
  files.push(...(data.files||[]).filter(file=>file.mimeType?.startsWith('image/')));
  pageToken=data.nextPageToken||'';
 }while(pageToken);
 return files.map((file,index)=>{
  const params=new URLSearchParams({id:file.id,sz:'w1600'});
  if(file.resourceKey) params.set('resourcekey',file.resourceKey);
  return {image_url:'https://drive.google.com/thumbnail?'+params,caption:file.name,
   file_name:file.name,drive_file_id:file.id,sort_order:index};
 });
}
async function resolveDriveImages(event,folderCache){
 const folder=driveFolderInfo(event.drive_folder_url);
 if(!folder) return event;
 try{
  const cacheKey=folder.id+'/'+folder.resourceKey;
  if(!folderCache.has(cacheKey)) folderCache.set(cacheKey,fetchDriveImages(folder));
  const images=await folderCache.get(cacheKey);
  if(images.length){
   const cover=images.find(image=>/main/i.test(image.file_name))||images[0];
   event.drive_fallback_images=event.event_images;
   event.drive_fallback_thumb=event.thumb;
   event.event_images=images;
   event.thumb=cover.image_url;
  }
 }catch(error){console.warn('Không tải được folder Drive của sự kiện '+event.id+': '+error.message)}
 return event;
}
async function loadEvents(){
 loadState='loading';render();
 try{
  const events=(await fetchPublishedEvents()).map(toWebEvent);
  const folderCache=new Map();
  all=await Promise.all(events.map(event=>resolveDriveImages(event,folderCache)));
  loadState='ready';
 }catch(error){
  all=[];loadState='error';console.error('Schedule loading failed:',error);
 }
 render();fixd();
}
